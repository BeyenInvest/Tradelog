<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Beyen voor TradingView</title>
  <style>
    /* Tijdelijke F1b-styling; de echte UI-laag (F2d/F4b) is Opus-werk. */
    body { width: 380px; margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0;
      font: 13px/1.45 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #7dd3fc; }
    .beta { font-size: 10px; color: #0f172a; background: #fbbf24; border-radius: 3px;
      padding: 1px 5px; vertical-align: middle; }
    label { display: block; color: #94a3b8; margin-bottom: 2px; }
    input { width: 100%; box-sizing: border-box; background: #020617; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 4px; padding: 6px; font: inherit; }
    button { background: #1d4ed8; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 10px; margin: 8px 6px 0 0; cursor: pointer; font: inherit; }
    button:hover { background: #2563eb; }
    button.warn { background: #7f1d1d; }
    .status { margin-bottom: 10px; color: #fbbf24; min-height: 17px; }
    .status.linked { color: #4ade80; }
    .hint { color: #64748b; font-size: 11px; margin-top: 6px; }
    pre { background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 8px;
      white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
      font-size: 11px; margin-top: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Beyen × TradingView <span class="beta">beta</span></h1>
  <div id="status" class="status">Status ophalen…</div>

  <section id="linkSection" hidden>
    <label for="token">Koppelcode</label>
    <input id="token" placeholder="Plak hier je koppelcode" autocomplete="off" />
    <button id="linkBtn">Verbind</button>
    <p class="hint">Genereer de koppelcode in Beyen → Instellingen → "Verbind TradingView-extensie" en plak 'm hier binnen een paar minuten.</p>
  </section>

  <section id="linkedSection" hidden>
    <button id="dumpBtn">Journal-schema</button>
    <button id="logBtn">Diagnose-log</button>
    <button id="unlinkBtn" class="warn">Koppel los</button>
  </section>

  <pre id="out" hidden></pre>
  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
