<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Beyen voor TradingView</title>
</head>
<body>
  <header class="popup-head">
    <span class="popup-mark" id="mark"></span>
    <span class="popup-title">Beyen</span>
    <span class="by-badge">beta</span>
  </header>

  <main class="popup-main">
    <div id="status" class="popup-status">Status ophalen…</div>

    <section id="linkSection" class="popup-stack" hidden>
      <div>
        <label class="by-label" for="token">Koppelcode</label>
        <input id="token" class="by-input" placeholder="Plak hier je koppelcode" autocomplete="off" />
      </div>
      <button id="linkBtn" class="by-btn by-btn-block">Verbind</button>
      <p class="by-hint" style="margin:0;">Genereer de koppelcode in Beyen → Instellingen → "Verbind TradingView-extensie" en plak 'm hier binnen een paar minuten.</p>
    </section>

    <section id="linkedSection" class="popup-stack" hidden>
      <div class="popup-actions">
        <button id="chartBtn" class="by-btn by-btn-ghost">Lees chart</button>
        <button id="dumpBtn" class="by-btn by-btn-ghost">Journal-schema</button>
        <button id="logBtn" class="by-btn by-btn-ghost">Diagnose-log</button>
        <button id="unlinkBtn" class="by-btn by-btn-ghost by-btn-danger">Koppel los</button>
      </div>
      <p class="by-hint" style="margin:0;">Loggen doe je in het paneel op je TradingView-chart — klik daar rechtsboven op het Beyen-knopje.</p>
    </section>

    <pre id="out" class="popup-out by-mono" hidden></pre>
  </main>
  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
