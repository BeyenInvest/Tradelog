<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon = the artist's BY-monogram-with-eye logo (REV 07), verbatim vector +
         rasterised PNG fallbacks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144.png" />
    <!-- PWA (Fase L): iOS add-to-home-screen only. The manifest link + SW are
         injected by vite-plugin-pwa at build; the SW only registers for beta.
         No global <meta name="theme-color"> on purpose — it would tint the mobile
         browser bar for every (also non-beta) visitor; the installed PWA still
         gets its colour from the manifest. The apple-* tags below are inert
         unless a user deliberately adds the app to their home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beyen" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Beyen — Eyes on every trade.</title>
    <!-- SEO + social preview (B5). Static because the SPA shell is one file; the
         copy describes the logged-out root (the landing). og:image is the brand
         lockup on gold — a dedicated 1200×630 card can replace it later. -->
    <meta name="description" content="Beyen — een trading- en backtest-journal dat zich vormt naar jouw methodiek. Cijfers die niets verbloemen: gemiste trades tellen nooit mee." />
    <link rel="canonical" href="https://beyen.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beyen" />
    <meta property="og:url" content="https://beyen.app/" />
    <meta property="og:title" content="Beyen — Eyes on every trade." />
    <meta property="og:description" content="Een trading- en backtest-journal dat zich vormt naar jouw methodiek. Cijfers die niets verbloemen." />
    <meta property="og:image" content="https://beyen.app/beyen-lockup-gold.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beyen — Eyes on every trade." />
    <meta name="twitter:description" content="Een trading- en backtest-journal dat zich vormt naar jouw methodiek. Cijfers die niets verbloemen." />
    <meta name="twitter:image" content="https://beyen.app/beyen-lockup-gold.png" />
    <!-- External (not inline): the CSP only allows script-src 'self', which blocked the inline version in production. -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
