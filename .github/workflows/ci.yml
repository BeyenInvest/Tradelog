# Fixplan blok B1: elke push + PR naar main moet lint (tsc), tests en build
# groen hebben. Owner-stap ná de eerste groene run: GitHub → Settings →
# Branches → branch protection op main → require status check "ci".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # G2: migratienummer-uniciteit + schema.sql-eindstand ("t/m NNNN") — de
      # goedkoopste wachter op de migratie-conventies, zonder DB.
      - run: npm run check:migrations
      - run: npm run test
      # Geen VITE_*-secrets nodig: de build leest env alleen in als inline
      # strings; de app zelf draait hier niet.
      - run: npm run build
      # TV-extensie (F-lijn): ook de extensiebundel moet bouwen vóór een merge.
      - run: npm run build:ext
